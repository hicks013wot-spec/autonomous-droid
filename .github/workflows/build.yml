name: Build Droid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install System dependencies (Zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Accept Android Licenses
        run: |
          mkdir -p ${ANDROID_HOME}/cmdline-tools/latest/bin
          yes | sdkmanager --licenses || true

      - name: Prepare project structure
        run: |
          mkdir -p my_app
          cp main.py my_app/
          cp requirements.txt my_app/

      - name: Install Python dependencies globally
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.21.2 SpeechRecognition gigachat pyttsx3 --break-system-packages

      - name: Build APK via Flet
        run: |
          cd my_app && flet build apk . --no-analytics

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droid-App-APK
          path: my_app/build/apk/*.apk
