name: Build Droid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libgtk-3-dev

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Install Python dependencies globally
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2 gTTS flet-audio-recorder --break-system-packages

      - name: Build APK via Flet
        run: |
          flet build apk . -vv

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droid-App-APK
          path: build/apk/*.apk
